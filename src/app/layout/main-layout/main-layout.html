<div class="shell" [class.shell--desktop]="isDesktop()">
  <app-header [showMenu]="!isDesktop()" (menuClick)="panelOpen.set(true)" />
  <app-side-panel
    [open]="panelOpen() || isDesktop()"
    [persistent]="isDesktop()"
    (closed)="panelOpen.set(false)"
  />

  <main class="app-container app-main">
    <router-outlet />
  </main>

  @if (!isDesktop()) {
    <app-bottom-menu />
  }
</div>
