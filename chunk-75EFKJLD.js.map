<section class="settings">
  <h1 class="section-title">સેટિંગ્સ</h1>

  <div class="settings__card">
    <div class="settings__row">
      <span>થીમ</span>
      <button type="button" class="settings__chip" (click)="theme.toggle()">
        {{ theme.theme() === 'dark' ? 'ડાર્ક' : 'લાઈટ' }}
      </button>
    </div>
    <div class="settings__row">
      <span>મોડ</span>
      <strong>{{ session.mode() === 'live' ? 'લાઈવ API' : 'ડેમો' }}</strong>
    </div>
    @if (session.credentials(); as c) {
      <div class="settings__row"><span>મોબાઈલ</span><strong>{{ c.mobile }}</strong></div>
      <div class="settings__row"><span>સોસાયટી કોડ</span><strong>{{ c.businessCode }}</strong></div>
      <div class="settings__row"><span>બિઝનેસ નંબર</span><strong>{{ c.businessNumber }}</strong></div>
    }
  </div>

  <button type="button" class="settings__logout" (click)="logout()">લોગ આઉટ</button>
</section>
